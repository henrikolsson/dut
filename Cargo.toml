[package]
name = "dut"
version = "0.1.0"
edition = "2024"
description = "Fast TUI disk usage analyzer that remembers previous scans"
license = "MIT OR Apache-2.0"
repository = "https://github.com/henrikolsson/dut"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
libc = "0.2.190"
lz4_flex = "0.14.0"
ratatui = "0.30.2"
rayon = "1.12.0"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
